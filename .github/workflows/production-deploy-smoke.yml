name: Production deploy smoke

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: production-deploy-smoke-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SOAK_BASE_URL: https://safe-inspector.vercel.app
      SOAK_ENVIRONMENT: production
      SOAK_DURATION_MINUTES: "5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify the public Safe review product flow
        run: node scripts/production-product-acceptance.mjs
      - name: Run bounded GET-only production checks
        run: node scripts/production-read-soak.mjs
