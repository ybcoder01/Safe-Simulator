name: Format preview Safe App branch

on:
  push:
    branches:
      - feat/safe-app-preview
    paths:
      - .github/workflows/format-safe-app-preview.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/safe-app-preview
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          src/app/globals.css
          src/components/safes/safe-app-review.tsx
          tests/unit/config/next-config.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/globals.css src/components/safes/safe-app-review.tsx tests/unit/config/next-config.test.ts
          git commit -m "Format Safe App preview changes"
          git push origin HEAD:feat/safe-app-preview
