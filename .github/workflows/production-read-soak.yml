name: Production read soak

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Bounded run duration
        required: true
        default: "15"
        type: choice
        options:
          - "5"
          - "15"
          - "30"

permissions:
  contents: read

concurrency:
  group: production-read-soak
  cancel-in-progress: false

jobs:
  soak:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOAK_BASE_URL: https://safe-inspector.vercel.app
      SOAK_ENVIRONMENT: production
      SOAK_DURATION_MINUTES: ${{ inputs.duration_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify the public Safe review product flow
        run: node scripts/production-product-acceptance.mjs
      - name: Run bounded GET-only checks
        run: node scripts/production-read-soak.mjs
